name: Print Secrets and Variables

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master

jobs:
  print:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FRONTEND_DEV_BUCKET: ${{ secrets.FRONTEND_DEV_BUCKET }}
      FRONTEND_PROD_BUCKET: ${{ secrets.FRONTEND_PROD_BUCKET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}

    steps:
      - name: Print secret metadata
        run: |
          echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_S3_BUCKET: $AWS_S3_BUCKET"
          echo "AWS_SECRET_ACCESS_KEY starts with: ${AWS_SECRET_ACCESS_KEY:0:4}"
          echo "CLOUDFRONT_DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID"
          echo "EC2_HOST: $EC2_HOST"
          echo "EC2_SSH_KEY length: ${#EC2_SSH_KEY}"
          echo "EC2_USERNAME: $EC2_USERNAME"
          echo "EMAIL_TO: $EMAIL_TO"
          echo "FRONTEND_DEV_BUCKET: $FRONTEND_DEV_BUCKET"
          echo "FRONTEND_PROD_BUCKET: $FRONTEND_PROD_BUCKET"
          echo "SMTP_HOST: $SMTP_HOST"
          echo "SMTP_PASSWORD length: ${#SMTP_PASSWORD}"
          echo "SMTP_PORT: $SMTP_PORT"
          echo "SMTP_USERNAME: $SMTP_USERNAME"
